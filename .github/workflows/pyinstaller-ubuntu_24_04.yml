---
name: Pyinstaller Build on Ubuntu 24.04 for GNU/Linux x86_64
on:
  release:
    types: ["published"]
  push:
    branches: ["develop", "trunk"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install APT packages on Ubuntu
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends --no-install-suggests ccache pkg-config yasm

      - name: Cache FFmpeg n7.0
        id: cache-ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ github.workspace }}/ffmpeg-n7.0
          key: ffmpeg-${{ hashFiles('ffmpeg-n7.0') }}

      - name: Clone FFmpeg, n7.0 tag
        if: ${{ steps.cache-ffmpeg.outputs.cache-hit != 'true' }}
        id: clone-ffmpeg-from-github
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: FFmpeg/FFmpeg
          path: ffmpeg-n7.0
          ref: n7.0
          fetch-depth: 1

      - name: Build FFmpeg from source (git submodule)
        working-directory: ./ffmpeg-n7.0
        run: |
          ./configure \
            --arch=x86_64 \
            --pkg-config-flags="--static" \
            --extra-cflags="-march=native" \
            --extra-libs="-lpthread -lm" \
            --ld="g++" \
            --disable-everything \
            --disable-shared \
            --disable-doc \
            --disable-htmlpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-autodetect \
            --disable-hwaccels \
            --disable-ffprobe \
            --disable-ffplay \
            --enable-bsf=aac_adtstoasc,extract_extradata,h264_metadata,mpeg2_metadata \
            --enable-decoder=aac,flac,h264,mjpeg \
            --enable-demuxer=aac,eac3,flac,h264,image2,mov,mpegts \
            --enable-encoder=aac,flac,h264,mjpeg \
            --enable-filter=copy \
            --enable-muxer=eac3,flac,h264,mjpeg,mpegts,mp4 \
            --enable-parser=aac,h264 \
            --enable-protocol=file \
            --enable-small
          make -j"$(nproc)"

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          architecture: "x64"
          check-latest: false
          python-version: '3.14.0'

      - name: Install dependencies
        env:
          UV_NO_MANAGED_PYTHON: 1
        run: |
          uv sync --locked --group build --no-group dev

      - name: Create Executable with PyInstaller
        env:
          UV_NO_MANAGED_PYTHON: 1
        run: |  # tzdata in order to avoid PyInstaller error 'No time zone found with key UTC'
          uv run --no-project pyinstaller \
            --name tidal-wave_ubuntu_22.04_amd64 \
            --target-arch=x86_64 \
            --paths src/tidal_wave \
            --exclude-module pyinstaller \
            --exclude-module ruff \
            --add-binary "ffmpeg-n7.0/ffmpeg:ffmpeg" \
            --collect-all tzdata \
            --clean \
            --noupx \
            --onefile \
            --strip \
            ./pyinstaller.py

      - name: Test just-compiled binary
        run: |
          chmod +x ./dist/tidal-wave_ubuntu_24.04_amd64
          ./dist/tidal-wave_ubuntu_24.04_amd64 --help

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          compression-level: 0
          name: tidal-wave_ubuntu
          overwrite: true
          path: |
            ./dist/tidal-wave_ubuntu_24.04_amd64
          retention-days: 7

      - name: Add artifact to release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            ./dist/tidal-wave_ubuntu_24.04_amd64
          token: ${{ github.token }}
