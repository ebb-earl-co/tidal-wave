---
name: Build Python package
on:
  release:
    types: ["published"]

jobs:
  build:
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/tidal-wave

    permissions:
      contents: write
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0
        with:
          python-version: "3.13.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel build

      - name: Build package
        run: python3 -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Add artifacts to release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090  # v2.4.1
        with:
          token: ${{ github.token }}
          files: |
            dist/tidal-wave-${{ github.event.release.tag_name }}.tar.gz
            dist/tidal_wave-${{ github.event.release.tag_name }}-py3-none-any.whl
