repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
    - id: check-ast
    - id: check-case-conflict
    - id: check-toml
    - id: check-yaml
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: requirements-txt-fixer
    - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.3
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix, "--ignore=FA102" ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
    - id: actionlint
- repo: local
  hooks:
    - id: version-match
      name: Matching pyproject.toml version and pyinstaller.py version
      description: This hook makes sure that the version of tidal-wave matches between pyproject.toml and pyinstaller.py.
      entry: hooks/version-match.py
      language: unsupported_script
