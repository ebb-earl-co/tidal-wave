---
name: Pyinstaller Build on macOS for macOS x86_64
on:
  release:
    types: ["published"]
  push:
    branches: ["develop", "trunk"]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Homebrew Bundler RubyGems
        run: brew install-bundler-gems

      # https://trac.ffmpeg.org/wiki/CompilationGuide/macOS#InstallingdependencieswithHomebrew
      - name: Get FFmpeg dependencies from Homebrew
        id: brew-install-ffmpeg-deps
        run: brew install automake nasm shtool xvid

      - name: Cache FFmpeg n9.0
        id: cache-ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/ffmpeg-n9.0
          key: ffmpeg-${{ hashFiles('ffmpeg-n9.0') }}

      - name: Clone FFmpeg, n9.0 tag
        if: ${{ steps.cache-ffmpeg.outputs.cache-hit != 'true' }}
        id: clone-ffmpeg-from-github
        uses: actions/checkout@v7.0.1
        with:
          repository: FFmpeg/FFmpeg
          path: ffmpeg-n9.0
          ref: n9.0
          fetch-depth: 1

      - name: Build FFmpeg from source
        working-directory: ./ffmpeg-n9.0
        run: |
          ./configure \
            --arch=x86_64 \
            --target-os=darwin \
            --pkg-config-flags="--static" \
            --extra-ldflags="-arch x86_64" \
            --disable-everything \
            --disable-shared \
            --disable-doc \
            --disable-htmlpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-autodetect \
            --disable-hwaccels \
            --disable-ffprobe \
            --disable-ffplay \
            --enable-bsf=aac_adtstoasc,extract_extradata,h264_metadata,mpeg2_metadata \
            --enable-decoder=aac,flac,h264,mjpeg \
            --enable-demuxer=aac,eac3,flac,h264,image2,mov,mpegts \
            --enable-encoder=aac,flac,h264,mjpeg \
            --enable-filter=copy \
            --enable-muxer=eac3,flac,h264,mjpeg,mpegts,mp4 \
            --enable-parser=aac,h264 \
            --enable-protocol=file \
            --enable-small
            make -j"$(sysctl -n hw.logicalcpu)"

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          architecture: "x64"
          check-latest: false
          python-version: "3.14.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: '3.14.10'

      - name: Install dependencies
        env:
          UV_NO_MANAGED_PYTHON: 1
        run: |
          uv sync --locked --group build --no-group dev

      - name: Create Executable with Pyinstaller
        env:
          UV_NO_MANAGED_PYTHON: 1
        run: |
          uv run --no-project pyinstaller \
            --name tidal-wave_macos_amd64 \
            --target-arch=x86_64 \
            --paths src/tidal_wave \
            --exclude-module pyinstaller \
            --exclude-module ruff \
            --add-binary "ffmpeg-n9.0/ffmpeg:ffmpeg" \
            --collect-all tzdata \
            --clean \
            --noupx \
            --onefile \
            --strip \
            ./pyinstaller.py

      - name: Test just-compiled binary
        run: |
          ./dist/tidal-wave_macos_amd64 --help

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          compression-level: 0
          name: tidal-wave_macos_amd64
          overwrite: true
          path: |
            ./dist/tidal-wave_macos_amd64
          retention-days: 7

      - name: Add artifact to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: |
            ./dist/tidal-wave_macos_amd64
          token: ${{ github.token }}
