---
name: Python linting with Ruff
on:
  push:
    branches: ["trunk", "develop"]
  pull_request:
    branches: ["trunk", "develop"]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        version: ["3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025, macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-python: "true"
          enable-cache: "true"
          python-version: ${{ matrix.version }}
          version-file: "pyproject.toml"

      - name: Format with Ruff
        run: uv run --no-project --with ruff ruff format --diff ./src/tidal_wave/

      - name: Lint with Ruff
        run: uv run --no-project --with ruff ruff check --statistics --exclude pyinstaller.py ./src/tidal_wave/
