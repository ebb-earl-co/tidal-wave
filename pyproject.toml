[build-system]
requires = ["uv_build>=0.9.4,<0.14"]
build-backend = "uv_build"
[project]
name = "tidal-wave"
description = "A tool to wave at the TIDAL music service."
authors = [{ name = "colinho", email = "pypi@colin.technology" }]
maintainers = [{ name = "colinho", email = "pypi@colin.technology" }]
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11.18, <3.15"
version = "2026.11.1"
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "backoff==2.2.1",
    "cachecontrol==0.14.3",
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2
    "dataclass-wizard==0.39.1",
    "ffmpeg-python==0.2.0",
    "mutagen==1.48.1",
    "m3u8==6.0.0",
    "msgpack>=1.2.3",  # CVE-2026-114613
    "platformdirs==4.5.1",
    "pycryptodome==3.23.0",
    "requests[socks]>=2.33.0",  # CVE-2026-25645
    "setuptools>=78.1.1", # CVE-2025-47273
    "typer==0.27.3",
    "tzdata==2026.6",
    "urllib3>=2.8.0"  # CVE-2026-44431
]
[project.scripts]
tidal-wave = "tidal_wave.main:app"
[project.urls]
Homepage = "https://github.com/ebb-earl-co/tidal-wave"

[dependency-groups]
dev = [
    "ruff"
]
build = [
    # https://github.com/pyinstaller/pyinstaller?tab=readme-ov-file#requirements-and-tested-platforms
    "pyinstaller==6.22.3",
    "pypiwin32==223 ; platform_system == 'Windows'",
]

[tool.ruff]
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.uv]
compile-bytecode = true  # https://docs.astral.sh/uv/reference/settings/#compile-bytecode
package = true  # https://docs.astral.sh/uv/reference/settings/#package
# https://docs.astral.sh/uv/reference/settings/#required-version
required-version = ">=0.13.6"  # eMudhra certificate fiasco
