---
name: Python application
on:
  push:
    branches: ["trunk", "develop"]
  pull_request:
    branches: ["trunk", "develop"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t"]
        # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    # Python 3.9 not available on macOS aarch64 any more
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        if: ${{ matrix.version != '3.9' && matrix.os == 'macos-latest'}}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.version }}
          version: ">=0.7.8"
      - name: Lint with Ruff
        if: ${{ matrix.version != '3.9' && matrix.os == 'macos-latest'}}
        run: uv run --no-project --with ruff ruff check --statistics --exclude pyinstaller.py ./tidal_wave/
      - name: Format with Ruff
        if: ${{ matrix.version != '3.9' && matrix.os == 'macos-latest'}}
        run: uv run --no-project --with ruff ruff format --diff tidal_wave
